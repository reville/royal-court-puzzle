<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royal Court · Board share images</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8e9;color:#372947;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1320px;margin:auto;padding:32px 24px}h1{font-size:32px;margin:0 0 8px}p{margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}h2{font-size:20px;margin:20px 0 5px}canvas{display:block;width:100%;height:auto;border-radius:12px;border:1px solid #d3c3df}button{background:#67478e;color:white;border:0;border-radius:30px;padding:12px 18px;min-height:44px;font:600 15px inherit;cursor:pointer}button[aria-pressed=true]{background:#30223f}.toggles{display:flex;gap:10px;flex-wrap:wrap}a{display:inline-block;color:#67478e;margin-top:10px}small{font-size:14px;color:#685575}@media(max-width:760px){.grid{grid-template-columns:1fr}main{padding:24px 16px}}</style><main><h1>Your board, without the words</h1><p>Brown clues · green correct answers · gray unfinished answers. Empty boxes show each word’s length. The positions and connections match the game.</p><div class="toggles"><button id="partial" aria-pressed="true">Example: unfinished</button><button id="finished" aria-pressed="false">Example: finished, 17s left</button></div><div class="grid"><article><h2>Rising council</h2><canvas id="board-0"></canvas><a id="download-0" download="royal-court-board-1.png">Save this image</a></article><article><h2>Two wings</h2><canvas id="board-1"></canvas><a id="download-1" download="royal-court-board-2.png">Save this image</a></article><article><h2>Round table</h2><canvas id="board-2"></canvas><a id="download-2" download="royal-court-board-3.png">Save this image</a></article></div></main><script>
function drawRoyalShare(canvas, summary) {
  // Geometry, letter counts, and statuses only: no words, IDs, hints, or typed values.
  const { solved, total, board, finished, secondsLeft, layout } = summary;
  canvas.width = 1080; canvas.height = 1350;
  const c = canvas.getContext('2d');
  const ink='#372947', muted='#685575', brown='#95643e', green='#25815b', gray='#a6a6ab';
  c.fillStyle='#fff8e9';c.fillRect(0,0,1080,1350);
  const text=(t,x,y,size=32,color=ink,weight=600) => {c.fillStyle=color;c.font=weight+' '+size+'px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(t,x,y);};
  text('ROYAL COURT',540,84,48,ink,800);
  text('BOARD '+String(board).padStart(2,'0')+'  ·  60-SECOND PUZZLE',540,144,25,muted);
  const scale=Math.min(960/layout.width,870/layout.height);
  const ox=(1080-layout.width*scale)/2,oy=215+(870-layout.height*scale)/2;
  const nodes=layout.nodes.map(n=>({...n,x:ox+n.x*layout.width*scale,y:oy+n.y*layout.height*scale,w:n.w*layout.width*scale,h:n.h*layout.height*scale}));
  const rounded=(x,y,w,h,r,fill,stroke=null,line=2)=>{c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=line;c.stroke();}};
  rounded(30,205,1020,900,42,'#d8c6e4');
  rounded(30,197,1020,900,42,'#f1e8f8','#dfd0e8',3);
  // Use the same parents and curved connections as the live board.
  nodes.forEach(child=>child.parents.forEach(index=>{
    const parent=nodes[index];
    const down=child.y>=parent.y;
    const sy=parent.y+(down?parent.h/2:-parent.h/2),ey=child.y+(down?-child.h/2:child.h/2);
    const cy=sy+Math.sign(ey-sy||1)*Math.max(20*scale,Math.abs(ey-sy)*.55);
    c.beginPath();c.moveTo(parent.x,sy);c.bezierCurveTo(parent.x,cy,child.x,cy,child.x,ey);
    c.strokeStyle='#c6b8cb';c.lineWidth=3;c.setLineDash(child.kind==='queen'?[]:[8,9]);c.stroke();
  }));
  c.setLineDash([]);
  nodes.forEach(n=>{
    if(n.kind==='queen') {
      rounded(n.x-56,n.y-38,112,82,30,'#352047');
      rounded(n.x-56,n.y-44,112,82,30,'#67478e','#d6a72f',3);
      c.fillStyle='#f4ce68';c.font='64px Georgia, serif';c.textAlign='center';c.textBaseline='middle';c.fillText('♛',n.x,n.y-2);return;
    }
    const color=n.kind==='clue'?brown:n.solved?green:gray;
    const outline=n.kind==='clue'?'#734728':n.solved?'#186044':'#827e89';
    const pale=n.kind==='clue'?'#fff0de':n.solved?'#e1f8e9':'#f6f3f8';
    const x=n.x-n.w/2,y=n.y-n.h/2,r=Math.min(20,n.h*.28);
    // Match the game's soft, raised speech bubbles and small tails.
    rounded(x,y+6,n.w,n.h,r,outline);
    rounded(x,y,n.w,n.h,r,color);
    c.beginPath();c.moveTo(n.x-10,y+n.h-2);c.lineTo(n.x+10,y+n.h-2);c.lineTo(n.x,y+n.h+13);c.closePath();c.fillStyle=outline;c.fill();
    c.beginPath();c.moveTo(n.x-8,y+n.h-4);c.lineTo(n.x+8,y+n.h-4);c.lineTo(n.x,y+n.h+8);c.closePath();c.fillStyle=color;c.fill();
    // Every box is empty, even when that word was solved.
    const count=n.letters,gap=Math.min(4,n.w*.022);
    const boxW=Math.min(26,(n.w-24-gap*(count-1))/count),boxH=Math.min(34,boxW*1.65);
    const left=n.x-(count*boxW+(count-1)*gap)/2;
    for(let i=0;i<count;i++)rounded(left+i*(boxW+gap),n.y-boxH/2,boxW,boxH,Math.min(5,boxW*.24),'rgba(255,255,255,.1)',pale,1.6);

  });
  text(solved+' / '+total+' whispers solved',540,1140,44,ink,800);
  text(finished?secondsLeft+'s left':'TIME’S UP',540,1210,finished?48:30,finished?green:muted,800);
  const legend=[['Clues',brown],['Solved',green],['Unsolved',gray]];
  legend.forEach(([label,color],i)=>{const x=300+i*240;rounded(x-85,1276,24,24,7,color);text(label,x+5,1288,24,muted,500);});
  canvas.setAttribute('role','img');canvas.setAttribute('aria-label','Royal Court board '+board+': '+solved+' of '+total+' whispers solved'+(finished?', '+secondsLeft+' seconds left':', time’s up')+'. Original board layout. Brown clues, green solved answers, gray unsolved answers. Empty boxes show letter counts; no letters or words shown.');
}
